<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Qcaaao's Bgs ValueList</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}


/* =========================
   HEADER
========================= */

header {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 60px;

    background: white;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    padding: 0 15px;

    z-index: 1000;
}


.menu-button {
    width: 42px;
    height: 42px;

    border: none;

    background: #eee;

    border-radius: 8px;

    font-size: 22px;

    cursor: pointer;

    margin-right: 12px;
}


.logo {
    font-size: 19px;

    font-weight: bold;

    white-space: nowrap;
}


/* =========================
   SEARCH
========================= */

.search-container {
    position: relative;

    /* Más separado del logo */
    margin-left: 40px;

    width: 260px;
}


.search {
    width: 100%;

    height: 38px;

    border: 1px solid #ccc;

    border-radius: 8px;

    padding: 0 12px;

    font-size: 14px;

    outline: none;
}


.search:focus {
    border-color: #999;
}


.search-results {
    display: none;

    position: absolute;

    top: 45px;
    left: 0;

    width: 100%;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    box-shadow: 0 5px 15px rgba(0,0,0,0.12);

    overflow: hidden;

    z-index: 2000;
}


.search-result {
    padding: 12px;

    cursor: pointer;

    border-bottom: 1px solid #eee;

    font-size: 14px;
}


.search-result:hover {
    background: #f2f2f2;
}


.no-results {
    padding: 12px;

    color: #777;

    font-size: 14px;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;

    top: 60px;

    left: -240px;

    width: 240px;

    height: calc(100vh - 60px);

    background: white;

    border-right: 1px solid #ddd;

    padding: 15px;

    transition: left 0.2s ease;

    z-index: 999;
}


.sidebar.open {
    left: 0;
}


/* =========================
   TEXT BUTTONS
========================= */

.text-button {
    width: 100%;

    background: transparent;

    border: none;

    padding: 12px;

    text-align: left;

    font-size: 15px;

    border-radius: 8px;

    cursor: pointer;

    margin-bottom: 4px;
}


.text-button:hover {
    background: #f1f1f1;
}


.text-button.active {
    background: #e8e8e8;

    font-weight: bold;
}


/* =========================
   MAIN
========================= */

main {
    padding-top: 85px;

    padding-left: 20px;
    padding-right: 20px;

    max-width: 1000px;

    margin: auto;
}


.page {
    display: none;
}


.page.active {
    display: block;
}


.page-title {
    margin-top: 0;

    margin-bottom: 20px;
}


/* =========================
   PET CARDS
========================= */

#petList {
    width: 100%;
}


.pet-card {
    width: 100%;

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 14px;

    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 12px;

    scroll-margin-top: 80px;
}


/* =========================
   PET IMAGE BOX
========================= */

.pet-image {
    width: 85px;
    height: 85px;

    flex-shrink: 0;

    border: 1px solid #ddd;

    border-radius: 10px;

    background: #f7f7f7;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/*
   El cuadro sigue midiendo 85x85,
   pero la imagen ocupa más espacio.
*/

.pet-image img {
    width: 115%;
    height: 115%;

    object-fit: contain;
}


/* =========================
   PET INFO
========================= */

.pet-info {
    display: flex;

    flex-direction: column;

    gap: 4px;
}


.pet-name {
    font-size: 18px;

    font-weight: bold;

    margin-bottom: 3px;
}


.pet-stats {
    font-size: 14px;

    color: #666;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .logo {
        font-size: 15px;
    }


    .search-container {

        width: 150px;

        /*
           También queda separado
           en móvil.
        */

        margin-left: 25px;
    }


    .search {
        height: 36px;
    }


    main {
        padding-left: 12px;
        padding-right: 12px;
    }


    .pet-card {
        padding: 12px;
    }


    .pet-image {
        width: 75px;
        height: 75px;
    }


    .pet-name {
        font-size: 17px;
    }


    .pet-stats {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <button
        class="menu-button"
        onclick="toggleMenu()"
    >
        ☰
    </button>


    <div class="logo">
        Qcaaao's Bgs ValueList
    </div>


    <div class="search-container">

        <input
            class="search"
            id="searchInput"
            type="text"
            placeholder="Search..."
            oninput="searchPets()"
        >


        <div
            class="search-results"
            id="searchResults"
        ></div>

    </div>

</header>



<!-- =========================
     SIDEBAR
========================= -->

<div
    class="sidebar"
    id="sidebar"
>


    <button
        class="text-button active"
        onclick="openPage('home', this)"
    >
        Home
    </button>


    <button
        class="text-button"
        onclick="openPage('explore', this)"
    >
        Explore
    </button>


    <button
        class="text-button"
        onclick="openPage('pets', this)"
    >
        Pets
    </button>


    <button
        class="text-button"
        onclick="openPage('values', this)"
    >
        Values
    </button>


    <button
        class="text-button"
        onclick="openPage('secrets', this)"
    >
        Secrets
    </button>


    <button
        class="text-button"
        onclick="openPage('wl-system', this)"
    >
        W/L System
    </button>

</div>



<!-- =========================
     MAIN
========================= -->

<main>


    <!-- =====================
         HOME
    ====================== -->

    <section
        class="page active"
        id="home"
    >

        <h1 class="page-title">
            Home
        </h1>


        <p>
            Welcome to Qcaaao's Bgs ValueList.
        </p>

    </section>



    <!-- =====================
         EXPLORE
    ====================== -->

    <section
        class="page"
        id="explore"
    >

        <h1 class="page-title">
            Explore
        </h1>


        <p>
            Explore Bubble Gum Simulator pets and values.
        </p>

    </section>



    <!-- =====================
         PETS
    ====================== -->

    <section
        class="page"
        id="pets"
    >

        <h1 class="page-title">
            Pets
        </h1>


        <div id="petList"></div>


        <script>

        /*
        ==========================================
        PETS

        Acá solamente están:
        - name
        - image

        NO están las características.
        ==========================================
        */

        const pets = [

            {
                name: "Shadow One",
                image: "images/1136-removebg-preview.png"
            }

        ];


        /*
        ==========================================
        CREAR ID AUTOMÁTICAMENTE
        ==========================================
        */

        function createPetId(name) {

            return name
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");

        }


        /*
        ==========================================
        CREAR TARJETAS
        ==========================================
        */

        const petList =
            document.getElementById("petList");


        pets.forEach(function(pet) {


            /*
            CARD
            */

            const card =
                document.createElement("div");


            card.className =
                "pet-card";


            card.id =
                createPetId(pet.name);



            /*
            IMAGEN
            */

            const imageBox =
                document.createElement("div");


            imageBox.className =
                "pet-image";


            const image =
                document.createElement("img");


            image.src =
                pet.image;


            image.alt =
                pet.name;


            imageBox.appendChild(image);



            /*
            INFORMACIÓN
            */

            const info =
                document.createElement("div");


            info.className =
                "pet-info";



            /*
            NOMBRE
            */

            const name =
                document.createElement("div");


            name.className =
                "pet-name";


            name.textContent =
                "Pet: " + pet.name;



            /*
            ======================================
            CARACTERÍSTICAS

            Están separadas de const pets.
            ======================================
            */

            const stats =
                document.createElement("div");


            stats.className =
                "pet-stats";


            stats.innerHTML = `
                Hatched: 100<br>
                Chance: 1/500<br>
                Value: 250
            `;



            /*
            ARMAR INFORMACIÓN
            */

            info.appendChild(name);

            info.appendChild(stats);



            /*
            ARMAR CARD
            */

            card.appendChild(imageBox);

            card.appendChild(info);


            petList.appendChild(card);

        });

        </script>

    </section>



    <!-- =====================
         VALUES
    ====================== -->

    <section
        class="page"
        id="values"
    >

        <h1 class="page-title">
            Values
        </h1>


        <p>
            Pet values will appear here.
        </p>

    </section>



    <!-- =====================
         SECRETS
    ====================== -->

    <section
        class="page"
        id="secrets"
    >

        <h1 class="page-title">
            Secrets
        </h1>


        <p>
            Secret pets will appear here.
        </p>

    </section>



    <!-- =====================
         W/L SYSTEM
    ====================== -->

    <section
        class="page"
        id="wl-system"
    >

        <h1 class="page-title">
            W/L System
        </h1>


        <p>
            W/L System
        </p>

    </section>


</main>



<script>

/* =========================
   SIDEBAR
========================= */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");


    sidebar.classList.toggle("open");

}


/* =========================
   CAMBIAR DE PÁGINA
========================= */

function openPage(pageId, button) {


    const pages =
        document.querySelectorAll(".page");


    pages.forEach(function(page) {

        page.classList.remove("active");

    });


    const selectedPage =
        document.getElementById(pageId);


    if (selectedPage) {

        selectedPage.classList.add("active");

    }


    const buttons =
        document.querySelectorAll(".text-button");


    buttons.forEach(function(btn) {

        btn.classList.remove("active");

    });


    if (button) {

        button.classList.add("active");

    }


    document
        .getElementById("sidebar")
        .classList.remove("open");

}



/* =========================
   BUSCAR PETS
========================= */

function searchPets() {


    const input =
        document.getElementById("searchInput");


    const results =
        document.getElementById("searchResults");


    const value =
        input.value
            .toLowerCase()
            .trim();


    results.innerHTML = "";



    /*
    SEARCH VACÍO
    */

    if (value === "") {

        results.style.display =
            "none";

        return;

    }



    /*
    BUSCAR SOLAMENTE PETS
    */

    const matches =
        pets.filter(function(pet) {

            return pet.name
                .toLowerCase()
                .includes(value);

        });



    /*
    SIN RESULTADOS
    */

    if (matches.length === 0) {

        results.innerHTML =
            '<div class="no-results">No results found.</div>';


        results.style.display =
            "block";


        return;

    }



    /*
    MOSTRAR RESULTADOS
    */

    matches.forEach(function(pet) {


        const result =
            document.createElement("div");


        result.className =
            "search-result";


        result.textContent =
            "Pet: " + pet.name;



        result.onclick = function() {


            /*
            ABRIR PÁGINA PETS
            */

            const petsPage =
                document.getElementById("pets");


            document
                .querySelectorAll(".page")
                .forEach(function(page) {

                    page.classList.remove("active");

                });


            petsPage.classList.add("active");



            /*
            ACTIVAR BOTÓN PETS
            */

            document
                .querySelectorAll(".text-button")
                .forEach(function(button) {


                    button.classList.remove("active");


                    if (
                        button.textContent.trim()
                        === "Pets"
                    ) {

                        button.classList.add("active");

                    }

                });



            /*
            CERRAR SEARCH
            */

            results.style.display =
                "none";


            input.value =
                "";



            /*
            BUSCAR CARD AUTOMÁTICAMENTE
            */

            const petId =
                createPetId(pet.name);


            const petElement =
                document.getElementById(petId);


            if (petElement) {

                petElement.scrollIntoView({

                    behavior: "smooth",

                    block: "center"

                });

            }

        };


        results.appendChild(result);

    });



    results.style.display =
        "block";

}



/* =========================
   CERRAR SEARCH AL TOCAR FUERA
========================= */

document.addEventListener(
    "click",
    function(event) {


        const searchContainer =
            document.querySelector(
                ".search-container"
            );


        if (
            !searchContainer.contains(
                event.target
            )
        ) {


            document
                .getElementById("searchResults")
                .style.display = "none";

        }

    }
);

</script>


</body>
</html>
