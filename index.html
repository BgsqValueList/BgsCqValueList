<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Qcaaao's Bgs ValueList</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Arial, sans-serif;

    background: #f5f5f5;

    color: #222;
}


/* =====================================================
   HEADER
===================================================== */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 75px;

    background: white;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    padding: 0 30px;

    z-index: 1000;
}


.menu-button {

    width: 52px;
    height: 52px;

    border: none;

    background: #eee;

    border-radius: 10px;

    font-size: 27px;

    cursor: pointer;

    margin-right: 22px;
}


.logo {

    font-size: 25px;

    font-weight: bold;

    white-space: nowrap;
}


/* =====================================================
   SEARCH
===================================================== */

.search-container {

    position: relative;

    margin-left: 100px;

    width: 420px;
}


.search {

    width: 100%;

    height: 48px;

    border: 1px solid #ccc;

    border-radius: 10px;

    padding: 0 15px;

    font-size: 17px;

    outline: none;
}


.search:focus {

    border-color: #999;
}


.search-results {

    display: none;

    position: absolute;

    top: 55px;

    left: 0;

    width: 100%;

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    box-shadow: 0 6px 18px rgba(0,0,0,0.12);

    overflow: hidden;

    z-index: 2000;
}


.search-result {

    padding: 15px;

    cursor: pointer;

    border-bottom: 1px solid #eee;

    font-size: 16px;
}


.search-result:hover {

    background: #f2f2f2;
}


.no-results {

    padding: 15px;

    color: #777;

    font-size: 16px;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    position: fixed;

    top: 75px;

    left: -330px;

    width: 330px;

    height: calc(100vh - 75px);

    background: white;

    border-right: 1px solid #ddd;

    padding: 25px;

    transition: left 0.2s ease;

    z-index: 999;
}


.sidebar.open {

    left: 0;
}


/* =====================================================
   TEXT BUTTONS
===================================================== */

.text-button {

    width: 100%;

    background: transparent;

    border: none;

    padding: 18px;

    text-align: left;

    font-size: 18px;

    border-radius: 10px;

    cursor: pointer;

    margin-bottom: 6px;
}


.text-button:hover {

    background: #f1f1f1;
}


.text-button.active {

    background: #e8e8e8;

    font-weight: bold;
}


/* =====================================================
   MAIN
===================================================== */

main {

    padding-top: 110px;

    padding-left: 55px;

    padding-right: 55px;

    width: 100%;

    max-width: 1800px;

    margin: auto;
}


.page {

    display: none;
}


.page.active {

    display: block;
}


.page-title {

    margin-top: 0;

    margin-bottom: 30px;

    font-size: 36px;
}


/* =====================================================
   PET LIST
===================================================== */

.pet-list {

    width: 100%;
}


/* =====================================================
   PET CARD
===================================================== */

.pet-card {

    width: 100%;

    min-height: 150px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 16px;

    padding: 20px;

    display: flex;

    align-items: center;

    gap: 25px;

    margin-bottom: 16px;

    position: relative;

    scroll-margin-top: 100px;
}


/* =====================================================
   PET IMAGE
===================================================== */

.pet-image {

    width: 125px;

    height: 125px;

    flex-shrink: 0;

    border: 1px solid #ddd;

    border-radius: 14px;

    background: #f7f7f7;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


.pet-image img {

    width: 115%;

    height: 115%;

    object-fit: contain;

    transition: 0.2s;
}


/* =====================================================
   PET INFORMATION
===================================================== */

.pet-info {

    display: flex;

    flex-direction: column;

    gap: 5px;

    flex: 1;
}


.pet-name {

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 5px;
}


.pet-stats {

    font-size: 17px;

    color: #666;

    line-height: 1.5;
}


/* =====================================================
   VARIANT SELECTOR
===================================================== */

.variant-container {

    position: relative;

    margin-left: auto;

    align-self: center;
}


.variant-button {

    min-width: 150px;

    height: 65px;

    padding: 7px 12px;

    background: white;

    border: 1px solid #ccc;

    border-radius: 12px;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 16px;
}


.variant-button:hover {

    background: #f5f5f5;
}


.variant-button img {

    width: 48px;

    height: 48px;

    object-fit: contain;
}


.variant-arrow {

    margin-left: auto;

    font-size: 18px;
}


/* =====================================================
   VARIANT MENU
===================================================== */

.variant-menu {

    display: none;

    position: absolute;

    right: 0;

    top: 73px;

    width: 230px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    box-shadow: 0 6px 20px rgba(0,0,0,0.15);

    padding: 7px;

    z-index: 500;
}


.variant-menu.open {

    display: block;
}


.variant-option {

    width: 100%;

    min-height: 65px;

    border: none;

    background: transparent;

    border-radius: 9px;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 7px;

    font-size: 16px;

    text-align: left;
}


.variant-option:hover {

    background: #f1f1f1;
}


.variant-option img {

    width: 52px;

    height: 52px;

    object-fit: contain;
}


/* =====================================================
   PC EXTRA GRANDE
===================================================== */

@media (min-width: 1600px) {

    header {

        height: 85px;

        padding: 0 45px;
    }


    .menu-button {

        width: 58px;

        height: 58px;

        font-size: 30px;
    }


    .logo {

        font-size: 29px;
    }


    .search-container {

        width: 500px;

        margin-left: 130px;
    }


    .search {

        height: 54px;

        font-size: 19px;
    }


    .sidebar {

        top: 85px;

        width: 370px;

        height: calc(100vh - 85px);

        padding: 30px;
    }


    .text-button {

        padding: 21px;

        font-size: 20px;
    }


    main {

        padding-top: 125px;

        padding-left: 70px;

        padding-right: 70px;

        max-width: 2000px;
    }


    .page-title {

        font-size: 42px;
    }


    .pet-card {

        min-height: 180px;

        padding: 25px;

        gap: 30px;

        border-radius: 18px;
    }


    .pet-image {

        width: 150px;

        height: 150px;

        border-radius: 16px;
    }


    .pet-image img {

        width: 115%;

        height: 115%;
    }


    .pet-name {

        font-size: 27px;
    }


    .pet-stats {

        font-size: 20px;
    }


    .variant-button {

        min-width: 180px;

        height: 75px;

        font-size: 18px;
    }


    .variant-button img {

        width: 58px;

        height: 58px;
    }


    .variant-menu {

        width: 270px;

        top: 83px;
    }


    .variant-option {

        min-height: 75px;

        font-size: 18px;
    }


    .variant-option img {

        width: 60px;

        height: 60px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    header {

        height: 60px;

        padding: 0 10px;
    }


    .menu-button {

        width: 42px;

        height: 42px;

        font-size: 22px;

        margin-right: 10px;
    }


    .logo {

        font-size: 15px;
    }


    .search-container {

        width: 150px;

        margin-left: 25px;
    }


    .search {

        height: 36px;

        font-size: 14px;
    }


    .sidebar {

        top: 60px;

        left: -240px;

        width: 240px;

        height: calc(100vh - 60px);

        padding: 15px;
    }


    .sidebar.open {

        left: 0;
    }


    .text-button {

        padding: 12px;

        font-size: 15px;
    }


    main {

        padding-top: 85px;

        padding-left: 12px;

        padding-right: 12px;
    }


    .page-title {

        font-size: 26px;

        margin-bottom: 20px;
    }


    .pet-card {

        min-height: 0;

        padding: 12px;

        gap: 12px;

        border-radius: 12px;

        align-items: center;
    }


    .pet-image {

        width: 75px;

        height: 75px;

        border-radius: 10px;
    }


    .pet-image img {

        width: 115%;

        height: 115%;
    }


    .pet-info {

        min-width: 0;
    }


    .pet-name {

        font-size: 17px;
    }


    .pet-stats {

        font-size: 13px;

        line-height: 1.4;
    }


    .variant-container {

        flex-shrink: 0;
    }


    .variant-button {

        min-width: 55px;

        width: 55px;

        height: 55px;

        padding: 4px;

        justify-content: center;
    }


    .variant-button img {

        width: 43px;

        height: 43px;
    }


    .variant-button span.variant-name {

        display: none;
    }


    .variant-arrow {

        display: none;
    }


    .variant-menu {

        right: 0;

        top: 62px;

        width: 190px;
    }


    .variant-option {

        min-height: 55px;

        font-size: 14px;
    }


    .variant-option img {

        width: 43px;

        height: 43px;
    }

}

</style>

</head>


<body>

<script>

/* =====================================================
   VARIANT NAMES
===================================================== */

const variantNames = {

    normal: "Normal",

    shiny: "Shiny",

    mythic: "Mythic",

    shinyMythic: "Shiny Mythic"

};



/* =====================================================
   CREAR ID
===================================================== */

function createPetId(name) {

    return name
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

}



/* =====================================================
   CREAR CARD DE PET
===================================================== */

function createPetCard(
    pet,
    data,
    list
) {


    const card =
        document.createElement("div");


    card.className =
        "pet-card";


    card.id =
        createPetId(pet.name);



    /* ================================================
       IMAGEN PRINCIPAL
    ================================================= */

    const imageBox =
        document.createElement("div");


    imageBox.className =
        "pet-image";


    const mainImage =
        document.createElement("img");


    mainImage.src =
        data.normal.image;


    mainImage.alt =
        pet.name;


    imageBox.appendChild(mainImage);



    /* ================================================
       INFO
    ================================================= */

    const info =
        document.createElement("div");


    info.className =
        "pet-info";



    const name =
        document.createElement("div");


    name.className =
        "pet-name";


    name.textContent =
        "Pet: " + pet.name;



    const stats =
        document.createElement("div");


    stats.className =
        "pet-stats";


    stats.innerHTML = `

        Hatched: ${data.normal.hatched}<br>

        Chance: ${data.normal.chance}<br>

        Value: ${data.normal.value}

    `;



    info.appendChild(name);

    info.appendChild(stats);



    /* ================================================
       VARIANT CONTAINER
    ================================================= */

    const variantContainer =
        document.createElement("div");


    variantContainer.className =
        "variant-container";



    /* ================================================
       VARIANT BUTTON
    ================================================= */

    const variantButton =
        document.createElement("button");


    variantButton.className =
        "variant-button";


    variantButton.innerHTML = `

        <img src="${data.normal.image}">

        <span class="variant-name">
            Normal
        </span>

        <span class="variant-arrow">
            ▼
        </span>

    `;



    /* ================================================
       VARIANT MENU
    ================================================= */

    const variantMenu =
        document.createElement("div");


    variantMenu.className =
        "variant-menu";



    /* ================================================
       CREAR OPCIONES
    ================================================= */

    Object.keys(data).forEach(function(variant) {


        const variantData =
            data[variant];


        const option =
            document.createElement("button");


        option.className =
            "variant-option";


        option.innerHTML = `

            <img src="${variantData.image}">

            <span>
                ${variantNames[variant]}
            </span>

        `;



        /* ============================================
           CAMBIAR VARIANTE
        ============================================ */

        option.onclick =
            function(event) {

                event.stopPropagation();


                /* CAMBIAR IMAGEN */

                mainImage.src =
                    variantData.image;



                /* CAMBIAR STATS */

                stats.innerHTML = `

                    Hatched: ${variantData.hatched}<br>

                    Chance: ${variantData.chance}<br>

                    Value: ${variantData.value}

                `;



                /* CAMBIAR BOTÓN */

                variantButton.innerHTML = `

                    <img src="${variantData.image}">

                    <span class="variant-name">
                        ${variantNames[variant]}
                    </span>

                    <span class="variant-arrow">
                        ▼
                    </span>

                `;



                /* CERRAR MENU */

                variantMenu.classList.remove(
                    "open"
                );

            };



        variantMenu.appendChild(option);

    });



    /* ================================================
       ABRIR / CERRAR MENU
    ================================================= */

    variantButton.onclick =
        function(event) {

            event.stopPropagation();


            document
                .querySelectorAll(".variant-menu")
                .forEach(function(menu) {

                    if (
                        menu !== variantMenu
                    ) {

                        menu.classList.remove(
                            "open"
                        );

                    }

                });


            variantMenu.classList.toggle(
                "open"
            );

        };



    variantContainer.appendChild(
        variantButton
    );


    variantContainer.appendChild(
        variantMenu
    );



    /* ================================================
       ARMAR CARD
    ================================================= */

    card.appendChild(imageBox);

    card.appendChild(info);

    card.appendChild(
        variantContainer
    );


    list.appendChild(card);

}



/* =====================================================
   CARGAR PETS
===================================================== */

const petList =
    document.getElementById("petList");


pets.forEach(function(pet) {

    const data =
        petData[pet.name];


    if (data) {

        createPetCard(
            pet,
            data,
            petList
        );

    }

});



/* =====================================================
   CARGAR SECRETS
===================================================== */

const secretList =
    document.getElementById("secretList");


secrets.forEach(function(pet) {

    const data =
        secretData[pet.name];


    if (data) {

        createPetCard(
            pet,
            data,
            secretList
        );

    }

});



/* =====================================================
   SIDEBAR
===================================================== */

function toggleMenu() {

    const sidebar =
        document.getElementById("sidebar");


    sidebar.classList.toggle(
        "open"
    );

}



/* =====================================================
   CAMBIAR PÁGINA
===================================================== */

function openPage(
    pageId,
    button
) {


    document
        .querySelectorAll(".page")
        .forEach(function(page) {

            page.classList.remove(
                "active"
            );

        });


    const page =
        document.getElementById(pageId);


    if (page) {

        page.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(".text-button")
        .forEach(function(btn) {

            btn.classList.remove(
                "active"
            );

        });


    if (button) {

        button.classList.add(
            "active"
        );

    }


    document
        .getElementById("sidebar")
        .classList.remove(
            "open"
        );

}



/* =====================================================
   BUSCADOR
===================================================== */

function searchPets() {


    const input =
        document.getElementById(
            "searchInput"
        );


    const results =
        document.getElementById(
            "searchResults"
        );


    const value =
        input.value
            .toLowerCase()
            .trim();


    results.innerHTML = "";


    if (value === "") {

        results.style.display =
            "none";

        return;

    }



    /* ================================================
       BUSCAR PETS + SECRETS
    ================================================= */

    const allPets = [

        ...pets.map(function(pet) {

            return {
                ...pet,
                page: "pets"
            };

        }),

        ...secrets.map(function(pet) {

            return {
                ...pet,
                page: "secrets"
            };

        })

    ];



    const matches =
        allPets.filter(function(pet) {

            return pet.name
                .toLowerCase()
                .includes(value);

        });



    /* ================================================
       SIN RESULTADOS
    ================================================= */

    if (matches.length === 0) {

        results.innerHTML =
            '<div class="no-results">No results found.</div>';

        results.style.display =
            "block";

        return;

    }



    /* ================================================
       RESULTADOS
    ================================================= */

    matches.forEach(function(pet) {


        const result =
            document.createElement("div");


        result.className =
            "search-result";


        result.textContent =
            "Pet: " + pet.name;



        result.onclick =
            function() {


                /* ABRIR PÁGINA */

                const targetPage =
                    document.getElementById(
                        pet.page
                    );


                document
                    .querySelectorAll(".page")
                    .forEach(function(page) {

                        page.classList.remove(
                            "active"
                        );

                    });


                targetPage.classList.add(
                    "active"
                );



                /* ACTIVAR BOTÓN */

                document
                    .querySelectorAll(".text-button")
                    .forEach(function(button) {

                        button.classList.remove(
                            "active"
                        );


                        if (
                            button.textContent
                                .trim()
                                .toLowerCase()
                            === pet.page
                        ) {

                            button.classList.add(
                                "active"
                            );

                        }

                    });



                /* CERRAR SEARCH */

                results.style.display =
                    "none";


                input.value =
                    "";



                /* IR A LA PET */

                const petElement =
                    document.getElementById(
                        createPetId(
                            pet.name
                        )
                    );


                if (petElement) {

                    petElement.scrollIntoView({

                        behavior: "smooth",

                        block: "center"

                    });

                }

            };


        results.appendChild(
            result
        );

    });


    results.style.display =
        "block";

}



/* =====================================================
   CERRAR MENÚS AL TOCAR AFUERA
===================================================== */

document.addEventListener(
    "click",
    function() {

        document
            .querySelectorAll(".variant-menu")
            .forEach(function(menu) {

                menu.classList.remove(
                    "open"
                );

            });


        const results =
            document.getElementById(
                "searchResults"
            );


        results.style.display =
            "none";

    }
);

</script>
