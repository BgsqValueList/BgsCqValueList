<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qcaaao's Bgs ValueList</title>

<style>
:root{
    --main-color:#5865f2;
    --main-dark:#4752c4;
    --main-light:#eef0ff;
    --main-hover:#e1e4ff;
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
    overflow-x:hidden;
    overflow-y:auto;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:95px;
    background:var(--main-color);
    color:white;
    display:flex;
    align-items:center;
    padding:0 30px;
    z-index:1000;
    box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.menuButton{
    width:64px;
    height:64px;
    border:none;
    border-radius:15px;
    background:var(--main-dark);
    color:white;
    font-size:34px;
    font-weight:bold;
    cursor:pointer;
    flex-shrink:0;
}

.logo{
    font-size:34px;
    font-weight:bold;
    margin-left:25px;
    white-space:nowrap;
    flex-shrink:0;
}

.searchContainer{
    position:relative;
    width:650px;
    margin-left:auto;
    flex-shrink:1;
    min-width:220px;
}

#searchInput{
    width:100%;
    height:58px;
    border:3px solid white;
    border-radius:14px;
    padding:0 20px;
    font-size:21px;
    outline:none;
    background:white;
    color:#222;
}

.searchResults{
    position:absolute;
    top:66px;
    left:0;
    width:100%;
    max-height:420px;
    overflow-y:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    display:none;
    z-index:1500;
    scrollbar-width:thin;
    scrollbar-color:var(--main-color) var(--main-light);
}

.searchResults::-webkit-scrollbar{
    width:8px;
}

.searchResults::-webkit-scrollbar-track{
    background:var(--main-light);
}

.searchResults::-webkit-scrollbar-thumb{
    background:var(--main-color);
    border-radius:10px;
}

.searchItem{
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 16px;
    cursor:pointer;
    color:#222;
}

.searchItem:hover{
    background:var(--main-light);
}

.searchItem img{
    width:55px;
    height:55px;
    object-fit:contain;
    flex-shrink:0;
}

.searchInfo{
    display:flex;
    flex-direction:column;
}

.searchPetName{
    font-size:18px;
    font-weight:bold;
}

.searchVariant{
    font-size:14px;
    color:#777;
}

.noResults{
    padding:20px;
    text-align:center;
    color:#777;
}

.sidebar{
    position:fixed;
    top:95px;
    left:0;
    width:400px;
    height:calc(100vh - 95px);
    background:white;
    border-right:3px solid var(--main-color);
    padding:25px 20px;
    transform:translateX(-100%);
    transition:transform .2s ease;
    z-index:900;
    overflow-y:auto;
}

.sidebar.open{
    transform:translateX(0);
}

.sidebarButton{
    width:100%;
    padding:18px;
    margin-bottom:14px;
    border:none;
    border-radius:12px;
    background:var(--main-light);
    color:var(--main-color);
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    text-align:left;
}

.sidebarButton:hover{
    background:var(--main-hover);
}

.sidebarButton.active{
    background:var(--main-color);
    color:white;
}

main{
    width:100%;
    min-height:100vh;
    padding-top:95px;
    padding-left:30px;
    padding-right:30px;
    padding-bottom:80px;
}

.content{
    width:100%;
    max-width:2200px;
    margin:0 auto;
}

.page{
    display:none;
    width:100%;
}

.page.active{
    display:block;
}

.pageTitle{
    font-size:50px;
    margin:35px 0 30px;
    color:var(--main-color);
}

.homeBox{
    background:white;
    border:3px solid var(--main-color);
    border-radius:18px;
    padding:35px;
    font-size:24px;
    line-height:1.5;
}

.petList{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:20px;
    padding-bottom:20px;
}

.petCard{
    width:100%;
    min-height:210px;
    flex:0 0 auto;
    background:white;
    border:3px solid var(--main-color);
    border-radius:18px;
    display:flex;
    align-items:center;
    gap:25px;
    padding:18px 22px;
}

.petImage{
    width:170px;
    height:170px;
    object-fit:contain;
    flex-shrink:0;
}

.petInfo{
    flex:1;
    min-width:0;
}

.petName{
    font-size:30px;
    font-weight:bold;
    color:var(--main-color);
    margin-bottom:12px;
    word-break:break-word;
}

.petStat{
    font-size:21px;
    margin:7px 0;
}

.petStat b{
    color:#333;
}

.variantContainer{
    position:relative;
    flex-shrink:0;
}

.variantButton{
    width:220px;
    min-height:70px;
    background:white;
    border:3px solid var(--main-color);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    cursor:pointer;
    font-size:20px;
    font-weight:bold;
    color:#222;
}

.variantButton img{
    width:50px;
    height:50px;
    object-fit:contain;
}

.variantArrow{
    font-size:20px;
    color:var(--main-color);
    margin-left:8px;
}

.variantMenu{
    position:absolute;
    right:0;
    top:78px;
    width:270px;
    background:white;
    border:3px solid var(--main-color);
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    overflow:hidden;
    display:none;
    z-index:800;
}

.variantMenu.open{
    display:block;
}

.variantOption{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    cursor:pointer;
    font-size:18px;
    color:#222;
}

.variantOption:hover{
    background:var(--main-light);
}

.variantOption img{
    width:55px;
    height:55px;
    object-fit:contain;
}

.eggGrid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:25px;
    padding-bottom:30px;
}

.eggButton{
    border:3px solid var(--main-color);
    border-radius:18px;
    background:white;
    padding:20px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:280px;
}

.eggButton:hover{
    background:var(--main-light);
}

.eggImage{
    width:190px;
    height:190px;
    object-fit:contain;
}

.eggName{
    margin-top:15px;
    font-size:25px;
    font-weight:bold;
    color:var(--main-color);
}

.eggBackButton{
    border:none;
    background:var(--main-color);
    color:white;
    padding:14px 22px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    margin:30px 0 20px;
}

.eggBackButton:hover{
    background:var(--main-dark);
}

.configBox{
    background:white;
    border:3px solid var(--main-color);
    border-radius:18px;
    padding:30px;
    max-width:800px;
}

.configTitle{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

#colorSelect{
    width:100%;
    height:55px;
    border:3px solid var(--main-color);
    border-radius:10px;
    padding:0 15px;
    font-size:20px;
    outline:none;
    background:white;
}

@media(min-width:601px) and (max-width:1599px){

    .searchContainer{
        max-width:45%;
    }

}

@media(min-width:1600px){

    header{
        height:110px;
        padding:0 40px;
    }

    .menuButton{
        width:74px;
        height:74px;
        font-size:40px;
    }

    .logo{
        font-size:42px;
        margin-left:30px;
    }

    .searchContainer{
        width:800px;
        max-width:none;
    }

    #searchInput{
        height:66px;
        font-size:24px;
    }

    .sidebar{
        top:110px;
        height:calc(100vh - 110px);
        width:470px;
    }

    .sidebarButton{
        font-size:26px;
        padding:22px;
    }

    main{
        padding-top:110px;
        padding-left:40px;
        padding-right:40px;
    }

    .content{
        max-width:2500px;
    }

    .pageTitle{
        font-size:62px;
        margin-top:45px;
    }

    .petCard{
        min-height:260px;
        padding:22px 28px;
    }

    .petImage{
        width:215px;
        height:215px;
    }

    .petName{
        font-size:38px;
    }

    .petStat{
        font-size:25px;
    }

    .variantButton{
        width:280px;
        min-height:85px;
        font-size:24px;
    }

    .variantButton img{
        width:65px;
        height:65px;
    }

    .variantMenu{
        width:330px;
        top:93px;
    }

    .variantOption{
        font-size:22px;
    }

    .variantOption img{
        width:65px;
        height:65px;
    }

    .eggImage{
        width:230px;
        height:230px;
    }

    .eggButton{
        min-height:330px;
    }

    .eggName{
        font-size:30px;
    }

}

@media(max-width:600px){

    header{
        height:60px;
        padding:0 8px;
    }

    .menuButton{
        width:43px;
        height:43px;
        border-radius:9px;
        font-size:23px;
    }

    .logo{
        font-size:15px;
        margin-left:8px;
        min-width:0;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .searchContainer{
        width:150px;
        min-width:120px;
        margin-left:auto;
    }

    #searchInput{
        height:38px;
        border-width:2px;
        border-radius:9px;
        padding:0 8px;
        font-size:13px;
    }

    .searchResults{
        top:44px;
        max-height:300px;
    }

    .searchItem{
        padding:8px;
        gap:8px;
    }

    .searchItem img{
        width:40px;
        height:40px;
    }

    .searchPetName{
        font-size:14px;
    }

    .searchVariant{
        font-size:11px;
    }

    .sidebar{
        top:60px;
        width:240px;
        height:calc(100vh - 60px);
        padding:15px 12px;
    }

    .sidebarButton{
        font-size:16px;
        padding:13px;
        margin-bottom:9px;
    }

    main{
        padding-top:60px;
        padding-left:12px;
        padding-right:12px;
        padding-bottom:80px;
    }

    .pageTitle{
        font-size:28px;
        margin:25px 0 20px;
    }

    .homeBox{
        padding:20px;
        font-size:17px;
    }

    .petList{
        gap:12px;
    }

    .petCard{
        min-height:120px;
        padding:10px;
        gap:10px;
        border-width:2px;
        border-radius:12px;
    }

    .petImage{
        width:75px;
        height:75px;
    }

    .petName{
        font-size:17px;
        margin-bottom:6px;
    }

    .petStat{
        font-size:13px;
        margin:3px 0;
    }

    .variantButton{
        width:55px;
        min-width:55px;
        height:55px;
        min-height:55px;
        padding:4px;
        justify-content:center;
        border-width:2px;
    }

    .variantButton img{
        width:45px;
        height:45px;
    }

    .variantButton span:not(.variantArrow){
        display:none;
    }

    .variantArrow{
        display:none;
    }

    .variantMenu{
        right:0;
        top:61px;
        width:200px;
        border-width:2px;
    }

    .variantOption{
        font-size:14px;
        padding:8px;
    }

    .variantOption img{
        width:40px;
        height:40px;
    }

    .eggGrid{
        grid-template-columns:1fr;
        gap:15px;
    }

    .eggButton{
        min-height:220px;
        padding:15px;
    }

    .eggImage{
        width:150px;
        height:150px;
    }

    .eggName{
        font-size:20px;
        margin-top:10px;
    }

    .eggBackButton{
        font-size:16px;
        padding:10px 16px;
        margin:18px 0 12px;
    }

    .configBox{
        padding:20px;
    }

    .configTitle{
        font-size:21px;
    }

    #colorSelect{
        height:45px;
        font-size:16px;
    }

}
</style>
</head>

<header>

</div>

</h1>

<div class="eggGrid">

>

<div class="eggName">
Common Egg
</div>

</button>

</div>

</section>


<section class="page" id="commonEgg">

<button

</section>


<section class="page" id="limitedSecrets">

Limited Secrets
</h1>

<div class="eggGrid">

<button class="eggButton" id="exoticEggButton">

    class="eggImage"

>

<div class="eggName">
Exotic Egg
</div>

</button>

</div>

</section>


<section class="page" id="exoticEgg">

<button
    class="eggBackButton"

>
← Back
</button>

<h1 class="pageTitle">
Exotic Egg
</h1>

<div class="petList" id="exoticEggList"></div>

</section>


<section class="page" id="temporaryPets">

<h1 class="pageTitle">
Temporary Pets
</h1>

<div class="eggGrid">

<button class="eggButton" id="shadowEggButton">

<img
    class="eggImage"
    src="images/ShadowEgg.png"
    alt="Shadow Egg"
>

<div class="eggName">
Shadow Egg
</div>

</button>

</div>

</section>


<section class="page" id="shadowEgg">

<button
    class="eggBackButton"
    data-back="temporaryPets"
>
← Back
</button>

<h1 class="pageTitle">
Shadow Egg
</h1>

<div class="petList" id="shadowEggList"></div>

</section>


<section class="page" id="config">

<h1 class="pageTitle">
Config
</h1>

<div class="configBox">

<div class="configTitle">
Choose Color
</div>

<select id="colorSelect">

<option value="blue">Blue</option>
<option value="red">Red</option>
<option value="green">Green</option>
<option value="purple">Purple</option>
<option value="pink">Pink</option>
<option value="orange">Orange</option>
<option value="yellow">Yellow</option>
<option value="cyan">Cyan</option>
<option value="black">Black</option>

</select>

</div>

</section>


</div>

</main>

function applyColor(name){

    const color =
        colors[name];

    if(!color) return;

    document.documentElement.style.setProperty(
        "--main-color",
        color.main
    );

    document.documentElement.style.setProperty(
        "--main-dark",
        color.dark
    );

    document.documentElement.style.setProperty(
        "--main-light",
        color.light
    );

    document.documentElement.style.setProperty(
        "--main-hover",
        color.hover
    );

    localStorage.setItem(
        "bgsColor",
        name
    );
}

const sidebar =

let currentPage =
    localStorage.getItem(
        "currentPage"
    ) || "home";


function openPage(pageName){

    document
        .querySelectorAll(".page")
        .forEach(page=>{

            page.classList.remove(
                "active"
            );

        });


    const page =
        document.getElementById(
            pageName
        );

    if(page){

        page.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(".sidebarButton")
        .forEach(button=>{

            button.classList.remove(
                "active"
            );

            if(
                button.dataset.page ===
                pageName
            ){

                button.classList.add(
                    "active"
                );

            }

        });


    currentPage =
        pageName;

    localStorage.setItem(
        "currentPage",
        pageName
    );


    sidebar.classList.remove(
        "open"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* =========================
   VARIANT NAME
========================= */

function getVariantPetName(
    originalName,
    variantKey
){

    if(
        variantKey ===
        "normal"
    ){

        return originalName;

    }

    if(
        variantKey ===
        "shiny"
    ){

        return "Shiny " +
            originalName;

    }

    if(
        variantKey ===
        "mythic"
    ){

        return "Mythic " +
            originalName;

    }

    if(
        variantKey ===
        "shinyMythic"
    ){

        return "Shiny Mythic " +
            originalName;

    }

    return originalName;
}


/* =========================
   PET CARD
========================= */

function createPetCard(
    petName,
    data
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "petCard";


    const firstVariant =
        data.normal;


    const image =
        document.createElement(
            "img"
        );

    image.className =
        "petImage";

    image.src =
        firstVariant.image;

    image.alt =
        petName;


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "petInfo";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "petName";

    name.textContent =
        getVariantPetName(
            petName,
            "normal"
        );


    const hatched =
        document.createElement(
            "div"
        );

    hatched.className =
        "petStat";

    hatched.innerHTML =
        "<b>Hatched:</b> " +
        firstVariant.hatched;


    const chance =
        document.createElement(
            "div"
        );

    chance.className =
        "petStat";

    chance.innerHTML =
        "<b>Chance:</b> " +
        firstVariant.chance;


    const value =
        document.createElement(
            "div"
        );

    value.className =
        "petStat";

    value.innerHTML =
        "<b>Value:</b> " +
        firstVariant.value;


    info.appendChild(name);
    info.appendChild(hatched);
    info.appendChild(chance);
    info.appendChild(value);


    const variantContainer =
        document.createElement(
            "div"
        );

    variantContainer.className =
        "variantContainer";


    const variantButton =
        document.createElement(
            "button"
        );

    variantButton.className =
        "variantButton";


    const variantImage =
        document.createElement(
            "img"
        );

    variantImage.src =
        firstVariant.image;


    const variantText =
        document.createElement(
            "span"
        );

    variantText.textContent =
        variantNames.normal;


    const arrow =
        document.createElement(
            "span"
        );

    arrow.className =
        "variantArrow";

    arrow.textContent =
        "▼";


    variantButton.appendChild(
        variantImage
    );

    variantButton.appendChild(
        variantText
    );

    variantButton.appendChild(
        arrow
    );


    const menu =
        document.createElement(
            "div"
        );

    menu.className =
        "variantMenu";


    variantOrder.forEach(
        variantKey=>{

            const variant =
                data[variantKey];

            if(!variant) return;


            const option =
                document.createElement(
                    "div"
                );

            option.className =
                "variantOption";


            const optionImage =
                document.createElement(
                    "img"
                );

            optionImage.src =
                variant.image;


            const optionText =
                document.createElement(
                    "span"
                );

            optionText.textContent =
                variantNames[
                    variantKey
                ];


            option.appendChild(
                optionImage
            );

            option.appendChild(
                optionText
            );


            option.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();


                    image.src =
                        variant.image;

                    variantImage.src =
                        variant.image;


                    variantText.textContent =
                        variantNames[
                            variantKey
                        ];


                    name.textContent =
                        getVariantPetName(
                            petName,
                            variantKey
                        );


                    hatched.innerHTML =
                        "<b>Hatched:</b> " +
                        variant.hatched;

                    chance.innerHTML =
                        "<b>Chance:</b> " +
                        variant.chance;

                    value.innerHTML =
                        "<b>Value:</b> " +
                        variant.value;


                    menu.classList.remove(
                        "open"
                    );

                }
            );


            menu.appendChild(
                option
            );

        }
    );


    variantButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();


            document
                .querySelectorAll(
                    ".variantMenu"
                )
                .forEach(
                    other=>{

                        if(
                            other !==
                            menu
                        ){

                            other.classList.remove(
                                "open"
                            );

                        }

                    }
                );


            menu.classList.toggle(
                "open"
            );

        }
    );


    variantContainer.appendChild(
        variantButton
    );

    variantContainer.appendChild(
        menu
    );


    card.appendChild(
        image
    );

    card.appendChild(
        info
    );

    card.appendChild(
        variantContainer
    );


    return card;
}

function renderList(
    list,
    data,
    containerId
){

    const container =
        document.getElementById(
            containerId
        );

    if(!container) return;


    container.innerHTML =
        "";


    list.forEach(
        petName=>{

            const card =
                createPetCard(
                    petName,
                    data[petName]
                );

            container.appendChild(
                card
            );

        }
    );

}

searchInput.addEventListener(
    "input",
    function(){

        const query =
            this.value
                .trim()
                .toLowerCase();


        searchResults.innerHTML =
            "";


        if(!query){

            searchResults.style.display =
                "none";

            return;

        }


        const results =
            searchData.filter(
                item =>
                    item.name
                        .toLowerCase()
                        .includes(query)
            );


        if(
            results.length ===
            0
        ){

            const noResults =
                document.createElement(
                    "div"
                );

            noResults.className =
                "noResults";

            noResults.textContent =
                "No pets found.";

            searchResults.appendChild(
                noResults
            );

            searchResults.style.display =
                "block";

            return;

        }


        results.forEach(
            item=>{

                const result =
                    document.createElement(
                        "div"
                    );

                result.className =
                    "searchItem";


                const image =
                    document.createElement(
                        "img"
                    );

                image.src =
                    item.image;


                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "searchInfo";


                const petName =
                    document.createElement(
                        "div"
                    );

                petName.className =
                    "searchPetName";

                petName.textContent =
                    item.name;


                const variant =
                    document.createElement(
                        "div"
                    );

                variant.className =
                    "searchVariant";

                variant.textContent =
                    item.variant;


                info.appendChild(
                    petName
                );

                info.appendChild(
                    variant
                );


                result.appendChild(
                    image
                );

                result.appendChild(
                    info
                );


                result.addEventListener(
                    "click",
                    function(){

                        openPage(
                            item.page
                        );

                        searchResults.style.display =
                            "none";

                        searchInput.value =
                            "";

                    }
                );


                searchResults.appendChild(
                    result
                );

            }
        );


        searchResults.style.display =
            "block";

    }
);
